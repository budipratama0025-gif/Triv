<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triv Admin</title><style>body{font-family:Arial;background:#07111f;color:#eef5ff;margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#0d1b2d;border:1px solid #20344d;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.in,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 10px;background:#081522;color:#fff;border:1px solid #29435f;border-radius:8px}.btn{padding:10px 13px;border:0;border-radius:8px;background:#1683f6;color:white;font-weight:700}.red{background:#b42318}.row{padding:12px 0;border-bottom:1px solid #20344d}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>TRIV ADMIN</h1><div id="login" class="card"><input id="e" class="in" value="admin@triv.web.id"><input id="p" class="in" type="password" value="TrivAdmin@2026!"><button class="btn" onclick="login()">Masuk</button><p id="msg"></p></div><div id="panel" style="display:none"><div class="card"><h2>Rekening Tujuan Deposit</h2><select id="b"></select><input id="n" class="in" placeholder="Nomor rekening"><input id="h" class="in" placeholder="Nama pemilik"><input id="l" class="in" placeholder="Label"><button class="btn" onclick="add()">Tambah</button><div id="ds"></div></div><div class="grid"><div class="card"><h2>Deposit Pending</h2><div id="deps"></div></div><div class="card"><h2>Withdrawal Pending</h2><div id="wds"></div></div></div></div></div><script>const API="GANTI_URL_APPS_SCRIPT";let T=localStorage.triv_admin;
function api(a,p={}){return fetch(API+"?"+new URLSearchParams({action:a,...p})).then(r=>r.json())}
async function login(){let d=await api("admin_login",{email:e.value,password:p.value});if(!d.ok)return msg.textContent=d.error;T=d.token;localStorage.triv_admin=T;show()}
function show(){login.style.display="none";panel.style.display="block";load()}
async function load(){let d=await api("admin_data",{token:T});if(!d.ok)return location.reload();b.innerHTML=d.banks.map(x=>"<option>"+x+"</option>").join("");ds.innerHTML=d.destinations.map(x=>"<div class=row><b>"+(x.label||x.bank)+"</b><br>"+x.bank+" — "+x.accountNumber+" a.n. "+x.accountHolder+" <button class='btn red' onclick="disable('"+x.id+"')">Nonaktifkan</button></div>").join("");deps.innerHTML=d.deposits.map(x=>"<div class=row>"+x.email+" — Rp "+Number(x.amount).toLocaleString("id-ID")+"<br>"+x.bank+" • "+(x.reference||"-")+"<br><button class=btn onclick="review('deposit','"+x.id+"','approve')">Setujui</button> <button class='btn red' onclick="review('deposit','"+x.id+"','reject')">Tolak</button></div>").join("")||"Tidak ada.";wds.innerHTML=d.withdrawals.map(x=>"<div class=row>"+x.email+" — Rp "+Number(x.amount).toLocaleString("id-ID")+"<br>"+x.bank+" • "+x.accountNumber+" • "+x.accountHolder+"<br><button class=btn onclick="review('withdrawal','"+x.id+"','approve')">Setujui</button> <button class='btn red' onclick="review('withdrawal','"+x.id+"','"+'reject'+"')">Tolak</button></div>").join("")||"Tidak ada."}
async function review(type,id,decision){let d=await api("review",{token:T,type,id,decision});alert(d.ok?"Berhasil diproses.":d.error);load()}
async function add(){let d=await api("add_dest",{token:T,bank:b.value,accountNumber:n.value,accountHolder:h.value,label:l.value});alert(d.ok?"Rekening tujuan ditambahkan.":d.error);load()}
async function disable(id){let d=await api("disable_dest",{token:T,id});alert(d.ok?"Dinonaktifkan.":d.error);load()}
if(T)show()</script></body></html>
