<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triv</title><style>
body{margin:0;font-family:Arial;background:#07111f;color:#eef5ff}.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:#0d1b2d;border:1px solid #20344d;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.in,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border-radius:9px;border:1px solid #29445f;background:#081522;color:#fff}.btn{padding:11px 15px;border:0;border-radius:9px;background:#1683f6;color:#fff;font-weight:700}.muted{color:#9db0c5}.bal{font-size:32px;font-weight:800}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>TRIV</h1>
<div id="auth" class="card"><h2>Daftar / Masuk</h2><input id="name" class="in" placeholder="Nama"><input id="email" class="in" placeholder="Email"><input id="password" class="in" type="password" placeholder="Password minimal 6 karakter"><button class="btn" id="regBtn">Daftar</button> <button class="btn" id="loginBtn">Masuk</button><p id="msg" class="muted"></p></div>
<div id="app" style="display:none"><div class="card"><div class="muted">Saldo tersedia</div><div id="balance" class="bal">Rp 0</div><button class="btn" id="logout">Keluar</button></div><div class="grid">
<div class="card"><h3>Rekening Member</h3><select id="bank"></select><input id="accountNumber" class="in" placeholder="Nomor rekening"><input id="accountHolder" class="in" placeholder="Nama pemilik"><button class="btn" id="saveAccount">Simpan Rekening</button></div>
<div class="card"><h3>Deposit</h3><select id="destination"></select><input id="depositAmount" class="in" type="number" placeholder="Nominal"><input id="reference" class="in" placeholder="Referensi"><button class="btn" id="deposit">Ajukan Deposit</button><p class="muted">Deposit pending. Saldo tidak bertambah sebelum admin menyetujui.</p></div>
<div class="card"><h3>Withdrawal</h3><input id="withdrawAmount" class="in" type="number" placeholder="Nominal"><button class="btn" id="withdraw">Ajukan Withdrawal</button></div><div class="card"><h3>Riwayat</h3><div id="history" class="muted"></div></div></div></div></div>
<script src="config.js"></script><script>
let token=localStorage.getItem("triv_member_token"),BANKS=["Bank Mandiri", "Bank Rakyat Indonesia (BRI)", "Bank Negara Indonesia (BNI)", "Bank Tabungan Negara (BTN)", "Bank Central Asia (BCA)", "Bank CIMB Niaga", "Bank Danamon", "Bank Permata", "Bank Panin", "Bank Maybank Indonesia", "Bank OCBC NISP", "Bank UOB Indonesia", "Bank Mega", "Bank Sinarmas", "Bank SMBC Indonesia", "Bank Jago", "Bank Neo Commerce", "Bank Seabank Indonesia", "Bank Amar Indonesia", "Bank Aladin Syariah", "Bank Syariah Indonesia (BSI)", "Bank Muamalat Indonesia", "Bank Mega Syariah", "Bank BCA Syariah", "Bank Panin Dubai Syariah", "Bank BJB", "Bank Jateng", "Bank Jatim", "Bank DIY", "Bank BPD Bali", "Bank Sumut", "Bank Sumsel Babel", "Bank Nagari", "Bank Riau Kepri", "Bank Lampung", "Bank Jambi", "Bank Bengkulu", "Bank Kalbar", "Bank Kalsel", "Bank Kalteng", "Bank Kaltimtara", "Bank Kaltara", "Bank Sulselbar", "Bank Sultra", "Bank Sulteng", "Bank SulutGo", "Bank Maluku Malut", "Bank Papua", "Bank Aceh Syariah", "Bank NTB Syariah", "Bank NTT", "Bank Woori Saudara", "Bank ICBC Indonesia", "Bank Shinhan Indonesia", "Bank DBS Indonesia", "Bank Citibank Indonesia", "Bank HSBC Indonesia", "Bank Standard Chartered Indonesia"];
const api=(a,p={})=>fetch(API_URL+"?"+new URLSearchParams({action:a,...p})).then(r=>r.json());
const money=n=>"Rp "+Number(n||0).toLocaleString("id-ID");
async function reg(){msg.textContent="Memproses...";try{let d=await api("register",{name:name.value,email:email.value,password:password.value});if(!d.ok)return msg.textContent=d.error;token=d.token;localStorage.triv_member_token=token;open()}catch(e){msg.textContent="Koneksi Apps Script gagal."}}
async function login(){msg.textContent="Memproses...";try{let d=await api("login",{email:email.value,password:password.value});if(!d.ok)return msg.textContent=d.error;token=d.token;localStorage.triv_member_token=token;open()}catch(e){msg.textContent="Koneksi Apps Script gagal."}}
async function open(){auth.style.display="none";app.style.display="block";bank.innerHTML=BANKS.map(x=>"<option>"+x+"</option>").join("");await load()}
async function load(){let d=await api("member",{token});if(!d.ok){localStorage.removeItem("triv_member_token");return location.reload()}balance.textContent=money(d.user.balance);bank.value=d.user.bank||BANKS[0];accountNumber.value=d.user.accountNumber||"";accountHolder.value=d.user.accountHolder||"";destination.innerHTML=d.destinations.map(x=>"<option value='"+x.id+"'>"+(x.label||x.bank)+" — "+x.accountNumber+" a.n. "+x.accountHolder+"</option>").join("")||"<option>Belum ada rekening tujuan</option>";history.innerHTML=[...d.deposits.map(x=>"<p>Deposit "+money(x.amount)+" — <b>"+x.status+"</b></p>"),...d.withdrawals.map(x=>"<p>Withdrawal "+money(x.amount)+" — <b>"+x.status+"</b></p>")].join("")||"Belum ada transaksi."}
regBtn.onclick=reg;loginBtn.onclick=login;logout.onclick=()=>{localStorage.removeItem("triv_member_token");location.reload()};saveAccount.onclick=async()=>{let d=await api("account",{token,bank:bank.value,accountNumber:accountNumber.value,accountHolder:accountHolder.value});alert(d.ok?"Rekening tersimpan.":d.error);load()};deposit.onclick=async()=>{let d=await api("deposit",{token,destinationId:destination.value,amount:depositAmount.value,reference:reference.value});alert(d.ok?d.message:d.error);if(d.ok)load()};withdraw.onclick=async()=>{let d=await api("withdraw",{token,amount:withdrawAmount.value,bank:bank.value,accountNumber:accountNumber.value,accountHolder:accountHolder.value});alert(d.ok?d.message:d.error);if(d.ok)load()};if(token)open();
</script></body></html>
