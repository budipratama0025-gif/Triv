<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triv Admin</title><style>body{margin:0;font-family:Arial;background:#07111f;color:#eef5ff}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#0d1b2d;border:1px solid #20344d;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.in,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 10px;background:#081522;color:#fff;border:1px solid #29435f;border-radius:8px}.btn{padding:10px 13px;border:0;border-radius:8px;background:#1683f6;color:white;font-weight:700}.red{background:#b42318}.row{padding:12px 0;border-bottom:1px solid #20344d}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>TRIV ADMIN</h1><div id="loginBox" class="card"><input id="adminEmail" class="in" value="admin@triv.web.id"><input id="adminPassword" class="in" type="password" value="TrivAdmin@2026!"><button class="btn" id="adminLogin">Masuk</button><p id="msg"></p></div><div id="panel" style="display:none"><div class="card"><h2>Rekening Tujuan Deposit</h2><select id="destBank"></select><input id="destNo" class="in" placeholder="Nomor rekening"><input id="destHolder" class="in" placeholder="Nama pemilik"><input id="destLabel" class="in" placeholder="Label"><button class="btn" id="addDest">Tambah</button><div id="destList"></div></div><div class="grid"><div class="card"><h2>Deposit Pending</h2><div id="depositList"></div></div><div class="card"><h2>Withdrawal Pending</h2><div id="withdrawList"></div></div></div></div></div><script src="config.js"></script><script>
let token=localStorage.getItem("triv_admin_token");const api=(a,p={})=>fetch(API_URL+"?"+new URLSearchParams({action:a,...p})).then(r=>r.json());
async function login(){let d=await api("admin_login",{email:adminEmail.value,password:adminPassword.value});if(!d.ok)return msg.textContent=d.error;token=d.token;localStorage.triv_admin_token=token;show()}
function show(){loginBox.style.display="none";panel.style.display="block";load()}
async function load(){let d=await api("admin_data",{token});if(!d.ok)return location.reload();destBank.innerHTML=d.banks.map(x=>"<option>"+x+"</option>").join("");destList.innerHTML=d.destinations.map(x=>"<div class=row>"+(x.label||x.bank)+"<br>"+x.bank+" — "+x.accountNumber+" a.n. "+x.accountHolder+" <button class='btn red' onclick="disableDest('"+x.id+"')">Nonaktifkan</button></div>").join("")||"Belum ada.";depositList.innerHTML=d.deposits.map(x=>"<div class=row>"+x.email+" — Rp "+Number(x.amount).toLocaleString("id-ID")+"<br>"+x.bank+" • "+(x.reference||"-")+"<br><button class=btn onclick="review('deposit','"+x.id+"','approve')">Setujui</button> <button class='btn red' onclick="review('deposit','"+x.id+"','reject')">Tolak</button></div>").join("")||"Tidak ada.";withdrawList.innerHTML=d.withdrawals.map(x=>"<div class=row>"+x.email+" — Rp "+Number(x.amount).toLocaleString("id-ID")+"<br>"+x.bank+" • "+x.accountNumber+" • "+x.accountHolder+"<br><button class=btn onclick="review('withdrawal','"+x.id+"','approve')">Setujui</button> <button class='btn red' onclick="review('withdrawal','"+x.id+"','reject')">Tolak</button></div>").join("")||"Tidak ada."}
async function review(type,id,decision){let d=await api("review",{token,type,id,decision});alert(d.ok?"Berhasil diproses.":d.error);load()}
async function add(){let d=await api("add_dest",{token,bank:destBank.value,accountNumber:destNo.value,accountHolder:destHolder.value,label:destLabel.value});alert(d.ok?"Rekening tujuan ditambahkan.":d.error);load()}
async function disableDest(id){let d=await api("disable_dest",{token,id});alert(d.ok?"Dinonaktifkan.":d.error);load()}
adminLogin.onclick=login;addDest.onclick=add;if(token)show();
</script></body></html>
