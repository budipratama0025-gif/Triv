<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triv</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#eef5ff}.wrap{max-width:1100px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:800}.card{background:#0d1b2d;border:1px solid #19304b;border-radius:18px;padding:20px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.btn{border:0;border-radius:10px;padding:12px 16px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#20344d}.input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #29445f;background:#081522;color:#fff;margin:7px 0 12px}.balance{font-size:32px;font-weight:800}.muted{color:#9db0c5}.hidden{display:none}.danger{color:#ff9b9b}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{padding:15px}}</style></head>
<body><div class="wrap">
<div class="nav"><div class="logo">TRIV</div><button class="btn secondary" onclick="logout()">Keluar</button></div>
<section id="auth" class="card"><h2>Masuk ke Triv</h2><input id="email" class="input" type="email" placeholder="Email"><input id="pass" class="input" type="password" placeholder="Password"><button class="btn" onclick="login()">Masuk</button><button class="btn secondary" style="margin-left:8px" onclick="register()">Daftar</button><p id="msg" class="muted"></p></section>
<section id="app" class="hidden"><div class="card"><div class="muted">Saldo tersedia</div><div id="balance" class="balance">Rp 0</div></div>
<div class="grid"><div class="card"><h3>Deposit</h3><input id="depBank" class="input" placeholder="Bank tujuan"><input id="depAmount" class="input" type="number" placeholder="Nominal"><input id="depRef" class="input" placeholder="Nomor referensi"><button class="btn" onclick="deposit()">Ajukan Deposit</button></div>
<div class="card"><h3>Withdrawal</h3><input id="wdBank" class="input" placeholder="Bank penerima"><input id="wdNo" class="input" placeholder="Nomor rekening"><input id="wdName" class="input" placeholder="Nama pemilik rekening"><input id="wdAmount" class="input" type="number" placeholder="Nominal"><button class="btn" onclick="withdraw()">Ajukan Withdrawal</button></div>
<div class="card"><h3>Rekening</h3><p class="muted">Rekening digunakan untuk proses withdrawal setelah disetujui admin.</p><div id="account">Belum ada rekening tersimpan.</div></div></div>
<div class="card"><h3>Riwayat</h3><div id="history" class="muted">Belum ada transaksi.</div></div></section></div>
<script>
const KEY='triv_users_v1'; const current=()=>localStorage.getItem('triv_current'); const users=()=>JSON.parse(localStorage.getItem(KEY)||'{}'); const save=u=>localStorage.setItem(KEY,JSON.stringify(u));
function money(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function register(){const e=email.value.trim().toLowerCase(),p=pass.value;if(!e||p.length<6){msg.textContent='Email dan password minimal 6 karakter wajib diisi.';return}const u=users();if(u[e]){msg.textContent='Akun sudah ada.';return}u[e]={email:e,balance:0,history:[],account:null};save(u);localStorage.setItem('triv_current',e);show();}
function login(){const e=email.value.trim().toLowerCase(),p=pass.value,u=users();if(!u[e]){msg.textContent='Akun belum terdaftar.';return}localStorage.setItem('triv_current',e);show();}
function show(){auth.classList.add('hidden');app.classList.remove('hidden');render();}
function logout(){localStorage.removeItem('triv_current');app.classList.add('hidden');auth.classList.remove('hidden')}
function render(){const u=users()[current()];if(!u)return logout();balance.textContent=money(u.balance);account.textContent=u.account?u.account.bank+' • '+u.account.number+' • '+u.account.name:'Belum ada rekening tersimpan.';history.innerHTML=u.history.length?u.history.slice().reverse().map(x=>'<div style="padding:10px 0;border-bottom:1px solid #19304b"><b>'+x.type+'</b> — '+money(x.amount)+'<br><span class="muted">'+x.status+' • '+x.date+'</span></div>').join(''):'Belum ada transaksi.'}
function deposit(){const a=Number(depAmount.value);if(a<=0)return alert('Nominal tidak valid.');const u=users()[current()];u.history.push({type:'Deposit',amount:a,status:'Menunggu persetujuan admin',date:new Date().toLocaleString('id-ID'),bank:depBank.value,reference:depRef.value});save(Object.assign(users(),{[current()]:u}));render();alert('Deposit berhasil diajukan. Saldo bertambah setelah disetujui admin.')}
function withdraw(){const a=Number(wdAmount.value),u=users()[current()];if(a<=0||a>u.balance)return alert('Saldo tidak mencukupi.');u.balance-=a;u.account={bank:wdBank.value,number:wdNo.value,name:wdName.value};u.history.push({type:'Withdrawal',amount:a,status:'Menunggu persetujuan admin',date:new Date().toLocaleString('id-ID')});save(Object.assign(users(),{[current()]:u}));render();alert('Withdrawal diajukan. Saldo ditahan sampai diproses admin.')}
if(current())show();
</script></body></html>
