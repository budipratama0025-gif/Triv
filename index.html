<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triv</title>
<style>body{font-family:Arial;background:#07111f;color:#eef5ff;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#0d1b2d;border:1px solid #20344d;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.in,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border-radius:9px;border:1px solid #29445f;background:#081522;color:#fff}.btn{padding:11px 15px;border:0;border-radius:9px;background:#1683f6;color:white;font-weight:700}.muted{color:#9db0c5}.bal{font-size:32px;font-weight:800}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>TRIV</h1>
<div id="auth" class="card"><h2>Masuk / Daftar</h2><input id="name" class="in" placeholder="Nama"><input id="email" class="in" placeholder="Email"><input id="pw" class="in" type="password" placeholder="Password minimal 6 karakter"><button class="btn" onclick="reg()">Daftar</button> <button class="btn" onclick="log()">Masuk</button><p id="m" class="muted"></p></div>
<div id="app" style="display:none"><div class="card">Saldo tersedia<div id="bal" class="bal">Rp 0</div></div><div class="grid">
<div class="card"><h3>Rekening Member</h3><select id="bank"></select><input id="ano" class="in" placeholder="Nomor rekening"><input id="ah" class="in" placeholder="Nama pemilik"><button class="btn" onclick="saveAcc()">Simpan</button></div>
<div class="card"><h3>Deposit</h3><select id="dest"></select><input id="da" class="in" type="number" placeholder="Nominal"><input id="ref" class="in" placeholder="Referensi"><button class="btn" onclick="dep()">Ajukan Deposit</button><p class="muted">Status pending. Saldo tidak bertambah sampai admin menyetujui.</p></div>
<div class="card"><h3>Withdrawal</h3><input id="wa" class="in" type="number" placeholder="Nominal"><button class="btn" onclick="wd()">Ajukan Withdrawal</button><p class="muted">Saldo ditahan; jika ditolak admin, saldo dikembalikan.</p></div>
<div class="card"><h3>Riwayat</h3><div id="hist" class="muted"></div></div></div></div></div>
<script>const API="GANTI_URL_APPS_SCRIPT";let T=localStorage.triv_token;const B=["Bank Mandiri", "Bank Rakyat Indonesia (BRI)", "Bank Negara Indonesia (BNI)", "Bank Tabungan Negara (BTN)", "Bank Central Asia (BCA)", "Bank CIMB Niaga", "Bank Danamon", "Bank Permata", "Bank Panin", "Bank Maybank Indonesia", "Bank OCBC NISP", "Bank UOB Indonesia", "Bank Mega", "Bank Sinarmas", "Bank SMBC Indonesia", "Bank Jago", "Bank Neo Commerce", "Bank Seabank Indonesia", "Bank Amar Indonesia", "Bank Aladin Syariah", "Bank Syariah Indonesia (BSI)", "Bank Muamalat Indonesia", "Bank Mega Syariah", "Bank BCA Syariah", "Bank Panin Dubai Syariah", "Bank KB Bukopin Syariah", "Bank Victoria Syariah", "Bank BJB", "Bank BJB Syariah", "Bank Jateng", "Bank Jatim", "Bank Jatim Syariah", "Bank DIY", "Bank BPD Bali", "Bank Sumut", "Bank Sumsel Babel", "Bank Nagari", "Bank Riau Kepri", "Bank Riau Kepri Syariah", "Bank Lampung", "Bank Jambi", "Bank Bengkulu", "Bank Kalbar", "Bank Kalsel", "Bank Kalteng", "Bank Kaltimtara", "Bank Kaltara", "Bank Sulselbar", "Bank Sultra", "Bank Sulteng", "Bank SulutGo", "Bank Maluku Malut", "Bank Papua", "Bank Aceh Syariah", "Bank NTB Syariah", "Bank NTT", "Bank Sahabat Sampoerna", "Bank Woori Saudara", "Bank ICBC Indonesia", "Bank Shinhan Indonesia", "Bank DBS Indonesia", "Bank Citibank Indonesia", "Bank HSBC Indonesia", "Bank Standard Chartered Indonesia"];
function api(a,p={}){return fetch(API+"?"+new URLSearchParams({action:a,...p})).then(r=>r.json())}
function money(x){return"Rp "+Number(x||0).toLocaleString("id-ID")}
async function reg(){let d=await api("register",{name:name.value,email:email.value,password:pw.value});if(!d.ok)return m.textContent=d.error;T=d.token;localStorage.triv_token=T;start()}
async function log(){let d=await api("login",{email:email.value,password:pw.value});if(!d.ok)return m.textContent=d.error;T=d.token;localStorage.triv_token=T;start()}
async function start(){auth.style.display="none";app.style.display="block";bank.innerHTML=B.map(x=>"<option>"+x+"</option>").join("");load()}
async function load(){let d=await api("member",{token:T});if(!d.ok){localStorage.removeItem("triv_token");return location.reload()}bal.textContent=money(d.user.balance);bank.value=d.user.bank||B[0];ano.value=d.user.accountNumber||"";ah.value=d.user.accountHolder||"";dest.innerHTML=d.destinations.map(x=>"<option value='"+x.id+"'>"+(x.label||x.bank)+" — "+x.accountNumber+" a.n. "+x.accountHolder+"</option>").join("");hist.innerHTML=[...d.deposits.map(x=>"<p>Deposit "+money(x.amount)+" — "+x.status+"</p>"),...d.withdrawals.map(x=>"<p>Withdrawal "+money(x.amount)+" — "+x.status+"</p>")].join("")||"Belum ada transaksi."}
async function saveAcc(){let d=await api("account",{token:T,bank:bank.value,accountNumber:ano.value,accountHolder:ah.value});alert(d.ok?"Rekening tersimpan.":d.error)}
async function dep(){let d=await api("deposit",{token:T,destinationId:dest.value,amount:da.value,reference:ref.value});alert(d.ok?d.message:d.error);if(d.ok)load()}
async function wd(){let d=await api("withdraw",{token:T,amount:wa.value,bank:bank.value,accountNumber:ano.value,accountHolder:ah.value});alert(d.ok?d.message:d.error);if(d.ok)load()}
if(T)start()</script></body></html>
